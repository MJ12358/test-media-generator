name: Publish

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+" # tag-pattern on pub.dev: 'v{{version}}'

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.pubspec.outputs.version }}
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Read pubspec.yaml
        id: pubspec
        uses: nichmor/minimal-read-yaml@v0.0.2
        with:
          config: "./pubspec.yaml"

  build:
    needs: setup
    permissions:
      contents: write # Required to update releases
      id-token: write # Required for authentication using OIDC

    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        include:
          - os: ubuntu-latest
            name: tmg_linux
            extension: ""
          - os: windows-latest
            name: tmg_windows
            extension: ".exe"

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Get Dependencies
        run: dart pub get

      - name: Set Name
        id: name
        uses: actions/github-script@v7
        with:
          script: |
            const version = '${{ needs.setup.outputs.version }}';
            const baseName = '${{ matrix.name }}';
            const extension = '${{ matrix.extension }}';
            const executableName = `${baseName}_v${version}${extension}`;
            core.setOutput('EXECUTABLE_NAME', executableName);

      - name: Compile
        run: dart compile exe bin/test_media_generator.dart -o bin/${{ steps.name.outputs.EXECUTABLE_NAME }}

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.name.outputs.EXECUTABLE_NAME }}
          path: bin/${{ steps.name.outputs.EXECUTABLE_NAME }}
          if-no-files-found: error

  release:
    needs: [setup, build]
    permissions:
      contents: write
      id-token: write

    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Get Release Notes
        id: release_notes
        uses: kiyoon/parse-changelog-action@v1
        with:
          changelog-file-path: CHANGELOG.md
          version: ${{ needs.setup.outputs.version }}

      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create Release
        uses: ncipollo/release-action@v1
        with:
          allowUpdates: true
          replacesArtifacts: false
          token: ${{ secrets.GITHUB_TOKEN }}
          tag: v${{ needs.setup.outputs.version }}
          commit: ${{ github.sha }}
          body: ${{ steps.release_notes.outputs.body }}
          artifacts: "artifacts/*"
